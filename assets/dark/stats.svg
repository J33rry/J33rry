<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" width="1600" height="430" fill="none" role="img" aria-label="GitHub statistics for J33rry">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    /* draw-on: shapes carry pathLength="1" so one dasharray fits every glyph */
    .dash { stroke-dasharray: 1; stroke-dashoffset: 1;
             animation: dash 1.15s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes dash { to { stroke-dashoffset: 0; } }

    .f { opacity: 0; animation: f .8s ease forwards; }
    @keyframes f { to { opacity: 1; } }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); }
                       to { opacity: 1; transform: translateY(0); } }

    .d1 { animation-delay: .05s } .d2 { animation-delay: .22s }
    .d3 { animation-delay: .45s } .d4 { animation-delay: .70s }
    .d5 { animation-delay: .95s } .d6 { animation-delay: 1.2s }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1 { transform-origin: 300px 0; animation-delay: 0.45s }
    .b1 { animation-delay: 0.50s }
    .g2 { transform-origin: 300px 0; animation-delay: 0.58s }
    .b2 { animation-delay: 0.63s }
    .g3 { transform-origin: 300px 0; animation-delay: 0.71s }
    .b3 { animation-delay: 0.76s }
    .g4 { transform-origin: 300px 0; animation-delay: 0.84s }
    .b4 { animation-delay: 0.89s }
    .g5 { transform-origin: 300px 0; animation-delay: 0.97s }
    .b5 { animation-delay: 1.02s }
    .n1 { animation-delay: .10s } .n2 { animation-delay: .22s }
    .n3 { animation-delay: .34s } .n4 { animation-delay: .46s }

    @media (prefers-reduced-motion: reduce) {
      .dash, .f, .rise, .bar { animation: none; }
      .bar { transform: scaleX(1); }
      .dash { stroke-dashoffset: 0; }
      .f, .rise { opacity: 1; transform: none; }
    }
  </style>

  <g class="rise n1">
    <text class="mono" x="48" y="104" font-size="56" font-weight="300" letter-spacing="2" fill="#ffffff">31</text>
    <text class="mono" x="51" y="136" font-size="12.5" letter-spacing="3.5" fill="#8b949e">PUBLIC REPOS</text>
  </g>
  <g class="rise n2">
    <text class="mono" x="428" y="104" font-size="56" font-weight="300" letter-spacing="2" fill="#ffffff">5</text>
    <text class="mono" x="431" y="136" font-size="12.5" letter-spacing="3.5" fill="#8b949e">STARS EARNED</text>
  </g>
  <g class="rise n3">
    <text class="mono" x="808" y="104" font-size="56" font-weight="300" letter-spacing="2" fill="#ffffff">2</text>
    <text class="mono" x="811" y="136" font-size="12.5" letter-spacing="3.5" fill="#8b949e">FOLLOWERS</text>
  </g>
  <g class="rise n4">
    <text class="mono" x="1188" y="104" font-size="56" font-weight="300" letter-spacing="2" fill="#ffffff">2</text>
    <text class="mono" x="1191" y="136" font-size="12.5" letter-spacing="3.5" fill="#8b949e">FOLLOWING</text>
  </g>

  <line class="dash" pathLength="1" x1="48" y1="180" x2="1552" y2="180"
        stroke="#ffffff" stroke-width="1" opacity="0.28"
        style="animation-delay:.5s;animation-duration:1.3s"/>

  <text class="mono f" x="48" y="188" font-size="12.5" letter-spacing="3.5"
        fill="#8b949e">LANGUAGE DISTRIBUTION — BY REPOSITORY</text>

  <text class="mono f b1" x="48" y="237" font-size="15" letter-spacing="2" fill="#ffffff">JavaScript</text>
  <line x1="300" y1="232" x2="1290" y2="232" stroke="#ffffff" stroke-width="6" opacity="0.10" stroke-linecap="round"/>
  <line class="bar g1" x1="300" y1="232" x2="885.0" y2="232" stroke="#ffffff" stroke-width="6" opacity="1.0" stroke-linecap="round"/>
  <text class="mono f b1" x="1552" y="237" text-anchor="end" font-size="14" letter-spacing="1.5" fill="#8b949e">59.1%</text>
  <text class="mono f b2" x="48" y="277" font-size="15" letter-spacing="2" fill="#ffffff">TypeScript</text>
  <line x1="300" y1="272" x2="1290" y2="272" stroke="#ffffff" stroke-width="6" opacity="0.10" stroke-linecap="round"/>
  <line class="bar g2" x1="300" y1="272" x2="570.0" y2="272" stroke="#ffffff" stroke-width="6" opacity="0.82" stroke-linecap="round"/>
  <text class="mono f b2" x="1552" y="277" text-anchor="end" font-size="14" letter-spacing="1.5" fill="#8b949e">27.3%</text>
  <text class="mono f b3" x="48" y="317" font-size="15" letter-spacing="2" fill="#ffffff">Python</text>
  <line x1="300" y1="312" x2="1290" y2="312" stroke="#ffffff" stroke-width="6" opacity="0.10" stroke-linecap="round"/>
  <line class="bar g3" x1="300" y1="312" x2="345.0" y2="312" stroke="#ffffff" stroke-width="6" opacity="0.64" stroke-linecap="round"/>
  <text class="mono f b3" x="1552" y="317" text-anchor="end" font-size="14" letter-spacing="1.5" fill="#8b949e">4.5%</text>
  <text class="mono f b4" x="48" y="357" font-size="15" letter-spacing="2" fill="#ffffff">CSS</text>
  <line x1="300" y1="352" x2="1290" y2="352" stroke="#ffffff" stroke-width="6" opacity="0.10" stroke-linecap="round"/>
  <line class="bar g4" x1="300" y1="352" x2="345.0" y2="352" stroke="#ffffff" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  <text class="mono f b4" x="1552" y="357" text-anchor="end" font-size="14" letter-spacing="1.5" fill="#8b949e">4.5%</text>
  <text class="mono f b5" x="48" y="397" font-size="15" letter-spacing="2" fill="#ffffff">Jupyter Notebook</text>
  <line x1="300" y1="392" x2="1290" y2="392" stroke="#ffffff" stroke-width="6" opacity="0.10" stroke-linecap="round"/>
  <line class="bar g5" x1="300" y1="392" x2="345.0" y2="392" stroke="#ffffff" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <text class="mono f b5" x="1552" y="397" text-anchor="end" font-size="14" letter-spacing="1.5" fill="#8b949e">4.5%</text>
</svg>
